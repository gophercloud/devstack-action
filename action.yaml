name: 'devstack-action'
description: 'Deploy OpenStack with devstack'
inputs:
  branch:
    description: 'Name of the branch to deploy'
    default: 'master'
  conf_overrides:
    description: 'Configuration overrides for devstack'
    default: ''
  enabled_services:
    description: 'Add or remove services to deploy via devstack'
    default: ''
  log_dir:
    description: 'Directory for logs'
    default: '/tmp/devstack-logs'
  enable_workaround_azure_mirror:
    description: 'Enable or disable workaround for stalled Azure APT mirror downloads'
    default: 'true'
  enable_workaround_docker_io:
    description: 'Enable or disable workaround for docker.io'
    default: 'true'
  force:
    description: 'Allow running devstack on unsupported distro'
    default: 'no'
  prefetch_cirros:
    description: 'Download the CirrOS images from GitHub Releases before running devstack'
    default: 'true'
runs:
  using: "composite"
  steps:
    - name: Install python pip
      run: python3 -m pip install --upgrade pip
      shell: bash
    - name: Workaround for Azure APT mirror
      if: ${{ inputs.enable_workaround_azure_mirror == 'true' }}
      run: |
        # Slow Azure mirror downloads can exhaust the job timeout.
        # See https://github.com/actions/runner-images/issues/14823
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
        else
          echo "No APT mirror list found; skipping Azure mirror workaround."
        fi
      shell: bash
    - name: Update APT cache
      run: sudo apt-get update
      shell: bash
    - name: Erase MySQL package
      run: sudo apt-get purge -y mysql-* || true
      shell: bash
    # This is to avoid RabbitMQ to fail at startup because a wrong version of erlang was installed
    - name: Workaround for RabbitMQ
      run: |
        # fix freaky leading "-e" in /etc/hosts
        # see https://github.com/actions/runner-images/issues/12192
        sudo sed -i 's/^-e \+//g' /etc/hosts
        sudo apt-get purge -y esl-erlang || true
        sudo apt-get install -y erlang rabbitmq-server # if rabbitmq-server is not installed, tests must be stopped
      shell: bash
    - name: Workaround for docker.io
      if: ${{ inputs.enable_workaround_docker_io == 'true' }}
      run: |
        sudo apt-get install -y runc || true
      shell: bash
    - name: Remove unwanted packages
      run: sudo apt-get purge -y python3-simplejson python3-pyasn1-modules postgresql* || true
      shell: bash
    - name: Checkout Devstack
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.branch }}
        repository: openstack/devstack
        path: ./devstack
    - name: Configure devstack
      run: |
        cat <<EOF > local.conf
        [[local|localrc]]
        ADMIN_PASSWORD=secret
        DATABASE_PASSWORD=root
        RABBIT_PASSWORD=secret
        SERVICE_PASSWORD=secret
        SWIFT_HASH=1234123412341234
        LOGFILE=${{ inputs.log_dir }}/devstack.log
        INSTALL_TEMPEST=False
        GIT_BASE=https://github.com
        EOF

        # horizon does not work in github action, permission error
        # dstat log takes too much memory to be stored by log artifacts
        # tempest must be disabled otherwise it will get installed still
        ENABLED_SERVICES=",-horizon,-dstat,-tempest"
        if [[ "${{ inputs.enabled_services }}" != "" ]]; then
          ENABLED_SERVICES+=",${{ inputs.enabled_services }}"
        fi
        echo "ENABLED_SERVICES+=${ENABLED_SERVICES}" >> local.conf

        # This must stay at the end to allow any overrides
        cat << EOF_CONF_OVERRIDES >> local.conf
        ${{ inputs.conf_overrides }}
        EOF_CONF_OVERRIDES
      working-directory: ./devstack
      shell: bash
    - name: Prefetch CirrOS images
      if: ${{ inputs.prefetch_cirros == 'true' }}
      run: |
        # The Ironic devstack plugin hardcodes http://download.cirros-cloud.net,
        # which often times out from GitHub runners. Devstack skips its own
        # download when the file is already in files/.
        conf_value() { sed -nE "s/^$1=\"?([^\"]+)\"?\$/\1/p" local.conf | tail -1; }
        version=$(conf_value CIRROS_VERSION)
        version=${version:-$(sed -nE 's/^CIRROS_VERSION=\$\{CIRROS_VERSION:-"?([^"}]+)"?\}.*/\1/p' stackrc)}
        arch=$(conf_value CIRROS_ARCH)
        arch=${arch:-$(uname -m)}
        mkdir -p files
        for name in "cirros-${version}-${arch}-uec.tar.gz" "cirros-${version}-${arch}-disk.img"; do
          [[ -s "files/${name}" ]] && continue
          # Download to a temporary name so devstack never sees a partial file.
          if curl -fsSL --retry 5 --retry-all-errors --connect-timeout 30 \
              -o "files/${name}.tmp" \
              "https://github.com/cirros-dev/cirros/releases/download/${version}/${name}"; then
            mv "files/${name}.tmp" "files/${name}"
          else
            rm -f "files/${name}.tmp"
            echo "::warning::Could not prefetch ${name}; devstack will download it itself."
          fi
        done
      working-directory: ./devstack
      shell: bash
    - name: Dump local.conf
      run: |
        cat local.conf
      working-directory: ./devstack
      shell: bash
    - name: Run devstack
      env:
        FORCE: ${{ inputs.force }}
      run: ./stack.sh
      working-directory: ./devstack
      shell: bash
